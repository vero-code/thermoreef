services:
  - type: web
    name: thermoreef
    runtime: python
    plan: free
    buildCommand: "cd frontend && npm install && npm run build && cd ../backend && pip install -r requirements.txt"
    startCommand: "cd backend && uvicorn backend.main:app --host 0.0.0.0 --port $PORT --app-dir src"
    envVars:
      - key: PYTHON_VERSION
        value: 3.14.0
      - key: VITE_GOOGLE_MAPS_API_KEY
        sync: false
